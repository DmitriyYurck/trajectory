[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[project]
name = "trajectory"
version = "0.1.0"
description = "Convert agent run logs to Parquet and upload to Hugging Face Buckets."
requires-python = ">=3.12"
dependencies = [
    "huggingface_hub>=1.5.0",
    "pyarrow>=14",
    "pyyaml>=6",
    "python-dotenv>=1",
    "requests>=2",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.ruff]
line-length = 120
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

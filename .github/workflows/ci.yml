name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest python-dotenv pyyaml requests huggingface_hub pyarrow
      - run: ruff check pipeline tests
      - run: ruff format --check pipeline tests
      - run: PYTHONPATH=. python -m pytest tests -q
